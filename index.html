<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RKLab - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER (Matches Heading Level 1 Test) -->
    <header>
        <div class="container">
            <h1>Welcome to RKLab!</h1>
            <p>Your Ultimate QA Automation Practice Arena</p>
        </div>
    </header>

    <!-- HERO SECTION (Matches Explore Button ID Test) -->
    <section class="hero">
        <div class="container">
            <h2>Welcome to RKLab</h2>
            <p>Experiment. Automate. Scale.</p>
            <button id="explore-btn" class="btn btn-primary" onclick="showWelcomeAlert()">Explore Features</button>
        </div>
    </section>

    <!-- MAIN CONTENT (Auth & Items) -->
    <main class="container">

        <!-- AUTH SECTION: SIGN UP + LOGIN -->
        <section id="auth-section" class="card">
            <h3 class="section-title">🔑 User Authentication</h3>
            <div class="auth-container">

                <!-- SIGN UP BOX -->
                <div class="auth-box">
                    <h4>📝 Create Account</h4>
                    <input type="text" id="signup-user" placeholder="Choose Username" autocomplete="off">
                    <input type="password" id="signup-pass" placeholder="Create Password">
                    <button class="btn btn-primary" onclick="handleSignup()">Sign Up</button>
                </div>

                <div class="divider"></div>

                <!-- LOGIN BOX -->
                <div class="auth-box">
                    <h4>🔐 Member Login</h4>
                    <input type="text" id="login-user" placeholder="Username" autocomplete="off">
                    <input type="password" id="login-pass" placeholder="Password">
                    <button class="btn btn-secondary" onclick="handleLogin()">Login</button>
                </div>

            </div>
            <!-- STATUS MESSAGE -->
            <p id="auth-status" class="status-msg"></p>
        </section>

        <!-- ITEMS SECTION -->
        <section id="items-section" class="card">
            <h3 class="section-title">📦 Lab Inventory</h3>
            <div id="items-list">
                <p>Loading items from database...</p>
            </div>
        </section>

    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2025 RKLab Enterprise | Designed for QA Excellence</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="script.js"></script>

</body>

</html>
