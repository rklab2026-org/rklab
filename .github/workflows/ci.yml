name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Playwright Browsers with System Dependencies
      run: |
        python -m playwright install --with-deps chromium

    - name: Start FastAPI Background Server
      run: |
        python -m uvicorn main:app --host 127.0.0.1 --port 8000 &
        sleep 5

    - name: Run All Playwright E2E UI & API Tests
      run: |
        python -m pytest tests/

    - name: Build Docker Image (Cloud Verification)
      run: |
        docker build -t rklab-backend .